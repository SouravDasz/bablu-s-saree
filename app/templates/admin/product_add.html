<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Product</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-100">

    <!-- Header -->
    <header class="bg-white border-b shadow-sm">
        <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">

            <h1 class="text-xl font-bold text-gray-900">
                Saree Shop
            </h1>

            <a href="/admin/dashboard" class="text-indigo-600 hover:text-indigo-800 font-medium">
                ← Dashboard
            </a>

        </div>
    </header>


    <!-- Main -->
    <main class="max-w-3xl mx-auto px-6 py-10">

        <div class="bg-white rounded-2xl shadow-sm border p-8">

            <!-- Heading -->
            <div class="mb-8">
                <h2 class="text-2xl font-bold text-gray-900">
                    Add New Product
                </h2>

                <p class="text-gray-500 mt-2">
                    Add a new saree to your store.
                </p>
            </div>


            <!-- Product Form -->
            <form method="post" action="/admin/products/add" enctype="multipart/form-data" class="space-y-6">

                <!-- Product Name -->
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
                        Product Name
                    </label>

                    <input id="name" type="text" name="name" placeholder="e.g. Banarasi Silk Saree" required class="w-full px-4 py-3 border border-gray-300 rounded-lg
                               focus:outline-none focus:ring-2
                               focus:ring-indigo-500 focus:border-indigo-500">
                </div>


                <!-- Saree Category -->
                <div>
                    <label for="category" class="block text-sm font-medium text-gray-700 mb-2">
                        Saree Category
                    </label>

                    <select id="category" name="category" required class="w-full px-4 py-3 border border-gray-300 rounded-lg
                               bg-white focus:outline-none focus:ring-2
                               focus:ring-indigo-500 focus:border-indigo-500">
                        <option value="" selected disabled>Select a category</option>
                        <option value="Banarasi">Banarasi</option>
                        <option value="Silk">Silk</option>
                        <option value="Kanjivaram">Kanjivaram</option>
                        <option value="Tussar">Tussar</option>
                        <option value="Muga">Muga</option>
                        <option value="Patola">Patola</option>
                        <option value="Chanderi">Chanderi</option>
                        <option value="Kota">Kota</option>
                        <option value="Dhakai Jamdani">Dhakai Jamdani</option>
                        <option value="Jamdani">Jamdani</option>
                        <option value="Cotton Saree">Cotton Saree</option>
                        <option value="Tant">Tant</option>
                        <option value="Baluchari">Baluchari</option>
                        <option value="Others">Others</option>
                    </select>
                </div>


                <!-- Description -->
                <div>
                    <label for="description" class="block text-sm font-medium text-gray-700 mb-2">
                        Description
                    </label>

                    <textarea id="description" name="description" rows="5" placeholder="Describe the saree..." required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg
                               resize-none
                               focus:outline-none focus:ring-2
                               focus:ring-indigo-500 focus:border-indigo-500"></textarea>
                </div>


                <!-- Price + Stock -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

                    <!-- Price -->
                    <div>
                        <label for="price" class="block text-sm font-medium text-gray-700 mb-2">
                            Price
                        </label>

                        <input id="price" type="number" name="price" step="0.01" min="0" placeholder="2500.00" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg
                                   focus:outline-none focus:ring-2
                                   focus:ring-indigo-500 focus:border-indigo-500">
                    </div>


                    <!-- Stock -->
                    <div>
                        <label for="stock" class="block text-sm font-medium text-gray-700 mb-2">
                            Stock
                        </label>

                        <input id="stock" type="number" name="stock" min="0" placeholder="10" required class="w-full px-4 py-3 border border-gray-300 rounded-lg
                                   focus:outline-none focus:ring-2
                                   focus:ring-indigo-500 focus:border-indigo-500">
                    </div>

                </div>


                <!-- Image -->
                <div>
                    <label for="image" class="block text-sm font-medium text-gray-700 mb-2">
                        Product Image
                    </label>

                    <input id="image" type="file" name="image" accept="image/*" class="w-full px-4 py-3 border border-gray-300
                               rounded-lg bg-white
                               focus:outline-none focus:ring-2
                               focus:ring-indigo-500">

                    <p class="text-sm text-gray-500 mt-2">
                        Upload a JPG, PNG or WebP image.
                    </p>
                </div>


                <!-- Buttons -->
                <div class="flex items-center gap-4 pt-4">

                    <a href="/admin/dashboard" class="flex-1 text-center px-6 py-3
                               border border-gray-300 rounded-lg
                               text-gray-700 font-medium
                               hover:bg-gray-50 transition">
                        Cancel
                    </a>

                    <button type="submit" class="flex-1 px-6 py-3
                               bg-indigo-600 text-white rounded-lg
                               font-semibold
                               hover:bg-indigo-700
                               transition">
                        Add Product
                    </button>

                </div>

            </form>

        </div>

    </main>

</body>

</html>
